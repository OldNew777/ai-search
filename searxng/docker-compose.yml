# SearXNG（单容器，无 valkey：单机自用不需要缓存/限流服务）
# 兼容 Podman（podman compose up -d）与 Docker；仅监听 127.0.0.1:47311
name: ai-search-searxng

services:
  core:
    image: docker.io/searxng/searxng:latest
    container_name: ai-search-searxng
    restart: unless-stopped
    ports:
      - "47311:8080"
    volumes:
      - ./core-config:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:47311/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "4"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

